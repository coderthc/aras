# =============================================================================
#  VAULT İÇERİĞİ (şablon) — bu satırları 'ansible-vault create secret_vars.yml'
#  ile açılan editöre yapıştır. Join, Administrator ile yapılır; ayrı bir
#  servis/join hesabı yoktur.
# =============================================================================

# Windows / WinRM + Linux domain join (ikisi de Administrator kullanıyor)
vault_win_user: "Administrator"
vault_win_password: "DEGISTIR_Administrator_Parolasi"

# AD DS
vault_dsrm_password: "DEGISTIR_DSRM_Parolasi"      # Directory Services Restore Mode
vault_user_password: "DEGISTIR_tolga.cerit_Parolasi"

# Linux 'linuxuser01' kullanıcısının SUDO (giriş) parolası — become için
vault_become_password: "DEGISTIR_linuxuser01_Parolasi"
