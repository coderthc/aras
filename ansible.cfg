[defaults]
inventory           = inventory.yml
host_key_checking   = False
result_format       = yaml
# SSH bağlantı + privilege escalation bekleme süresi.
# Domain join sonrası ilk 'sudo' SSSD soğukken 60 sn'yi aşabiliyor
# ("Timeout (62s) waiting for privilege escalation prompt"). 300 sn güvenli.
timeout             = 300
# Vault parolasını dosyadan oku -> her komutta --ask-vault-pass yazmana gerek kalmaz.
# Kurulum:  echo 'VAULT_PAROLAN' > ~/.vault_pass && chmod 600 ~/.vault_pass
vault_password_file = ~/.vault_pass

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=15
